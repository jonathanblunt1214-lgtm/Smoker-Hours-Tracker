name: Android build

on:
  pull_request:
    branches: [main, SmokeStack-development]
    paths:
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main, SmokeStack-development]
    paths:
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Detect native Android source
        id: native
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/settings.gradle ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "## Android build skipped" >> "${GITHUB_STEP_SUMMARY}"
            echo "The native Android source is not present on this branch." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.native.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.native.outputs.present == 'true'
        run: npm ci --no-audit --no-fund

      - name: Validate web application
        if: steps.native.outputs.present == 'true'
        run: npm run lint && npm run build

      - name: Install native Android toolchain
        if: steps.native.outputs.present == 'true'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @capacitor/core@8.5.0 \
            @capacitor/android@8.5.0 \
            @capacitor/cli@8.5.0 \
            @capacitor-firebase/authentication@8.4.0

      - name: Sync Capacitor Android project
        if: steps.native.outputs.present == 'true'
        run: npx cap sync android

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.native.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Provision verified Gradle 8.14.3
        if: steps.native.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.14.3
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_SHA="${GRADLE_ZIP}.sha256"
          curl --fail --location --silent --show-error \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "${GRADLE_ZIP}"
          curl --fail --location --silent --show-error \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256" \
            --output "${GRADLE_SHA}"
          printf '%s  %s\n' "$(cat "${GRADLE_SHA}")" "${GRADLE_ZIP}" | sha256sum --check --strict
          unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-${GRADLE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Test and build debug APK
        if: steps.native.outputs.present == 'true'
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        if: steps.native.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smokestack-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
