name: Release Smoke Stack Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: smokestack-windows-release
  cancel-in-progress: false

env:
  SMOKESTACK_API_URL: https://smoke-stack-zkqhknax2a-uc.a.run.app

jobs:
  build-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify release is from main
        shell: pwsh
        run: |
          git fetch origin main
          $head = git rev-parse HEAD
          $main = git rev-parse origin/main

          if ($head -ne $main) {
            Write-Error "Release must be built from current main."
            exit 1
          }

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        env:
          SMOKESTACK_API_URL: ${{ env.SMOKESTACK_API_URL }}
        run: npm run build

      - name: Build Windows installer
        env:
          SMOKESTACK_API_URL: ${{ env.SMOKESTACK_API_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notmatch "unpacked" } |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "No Windows installer was produced."
            exit 1
          }

          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Generate SHA-256
        id: digest
        shell: pwsh
        run: |
          $hash = Get-FileHash `
            -Path "${{ steps.installer.outputs.path }}" `
            -Algorithm SHA256

          $digest = $hash.Hash.ToLower()

          "$digest  ${{ steps.installer.outputs.name }}" |
            Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii

          "sha256=$digest" >> $env:GITHUB_OUTPUT

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path dist `
            -Filter "*.exe" `
            -Recurse |
            Where-Object {
              $_.FullName -match "win-unpacked" -and
              $_.Name -notmatch "elevate"
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Unable to locate packaged application executable."
            exit 1
          }

          $process = Start-Process `
            -FilePath $exe.FullName `
            -PassThru

          Start-Sleep -Seconds 10

          if ($process.HasExited -and $process.ExitCode -ne 0) {
            Write-Error "Smoke Stack exited during startup."
            exit 1
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

      - name: Create release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$env:RELEASE_TAG" `
            -m "Smoke Stack $env:RELEASE_TAG"

          git push origin "$env:RELEASE_TAG"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "${{ steps.installer.outputs.path }}" `
            "dist\SHA256SUMS.txt" `
            --title "Smoke Stack $env:RELEASE_TAG" `
            --generate-notes

      - name: Record release result
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Smoke Stack Windows Release"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Commit: $env:GITHUB_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Tag: ${{ inputs.tag }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Installer: ${{ steps.installer.outputs.name }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- SHA-256: ${{ steps.digest.outputs.sha256 }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Cloud Run API: $env:SMOKESTACK_API_URL"
