name: SmokeStack Codex Auto-Merge

on:
  workflow_run:
    workflows:
      - SmokeStack PR Validation
      - Phase 0 Trust Foundation Gate
    types: [completed]

permissions:
  contents: write
  checks: read
  statuses: read
  pull-requests: write
  issues: write

jobs:
  review-and-enable:
    name: Review routine Codex change
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # workflow_run has write authority, so only trusted code from the default
      # branch is executed. Pull-request code is inspected through the API.
      - name: Checkout trusted automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Classify and enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node .github/scripts/review-codex-pr.mjs
