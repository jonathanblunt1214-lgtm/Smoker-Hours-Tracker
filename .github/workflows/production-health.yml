name: Monitor SmokeStack production health

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: smokestack-production-health
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: smoker-log-app
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: smoke-stack
  DEPLOYER_SERVICE_ACCOUNT: smokestack-github@smoker-log-app.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/562567954075/locations/global/workloadIdentityPools/github/providers/smokestack
  INCIDENT_TITLE: "[automation] SmokeStack production health check failed"

jobs:
  health:
    name: Verify public health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - id: auth
        name: Authenticate read-only monitoring identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - id: service
        name: Resolve deployed service URL
        shell: bash
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}"             --project="${GCP_PROJECT_ID}"             --region="${GCP_REGION}"             --format='value(status.url)')"
          test -n "${service_url}"
          echo "url=${service_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify production health
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          curl --fail --silent --show-error             --retry 3 --retry-all-errors --retry-delay 10             --max-time 30 "${SERVICE_URL}/api/health"

      - name: Open or update one incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state open             --search "\"\${INCIDENT_TITLE}\" in:title"             --json number --jq '.[0].number // empty')"
          body="Scheduled production health verification failed. No recovery or deployment was attempted. Owner investigation is required. Run: ${RUN_URL}"
          if test -n "${issue_number}"; then
            gh issue comment "${issue_number}" --body "${body}"
          else
            gh issue create --title "${INCIDENT_TITLE}" --body "${body}"
          fi

      - name: Close resolved incident issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVICE_URL: ${{ steps.service.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state open             --search "\"\${INCIDENT_TITLE}\" in:title"             --json number --jq '.[0].number // empty')"
          if test -n "${issue_number}"; then
            gh issue comment "${issue_number}"               --body "Production health recovered and ${SERVICE_URL}/api/health is responding successfully."
            gh issue close "${issue_number}" --reason completed
          fi
