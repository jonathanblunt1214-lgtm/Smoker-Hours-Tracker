name: Phase 0 Trust Foundation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and verify trusted runtime
        run: npm run verify:owner-security

      - name: Verify trusted client assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f src/App.trusted.tsx
          test -f src/components/Navbar.trusted.tsx
          test -f src/utils/storage.trusted.ts
          grep -q "userSession?.isMasterAdmin === true" src/components/Navbar.trusted.tsx
          grep -q "'/api/admin/me'" src/App.trusted.tsx
          grep -q "Firestore is authoritative" src/App.trusted.tsx
          if grep -q "auth_token_default" src/App.trusted.tsx; then
            echo "Legacy default auth token remains in trusted client"
            exit 1
          fi
          if grep -q "MASTER_ADMIN_EMAIL" src/App.trusted.tsx; then
            echo "Hard-coded owner email remains in trusted client"
            exit 1
          fi
          if grep -q "autoEvolveCharGPTMemory" src/App.trusted.tsx; then
            echo "Automatic durable AI learning remains in trusted client"
            exit 1
          fi
          if grep -q "isMasterAdmin(currentUserEmail)" src/components/Navbar.trusted.tsx; then
            echo "Navbar still trusts email for admin visibility"
            exit 1
          fi
          if grep -q "hoursLogged = 6.0" src/utils/storage.trusted.ts; then
            echo "Fabricated cook duration remains in trusted storage"
            exit 1
          fi
          if grep -q "Excellent smoke ring" src/utils/storage.trusted.ts; then
            echo "Fabricated cook notes remain in trusted storage"
            exit 1
          fi

      - name: Verify trusted server assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f server.secure.generated.ts
          grep -q "requireOwner as any" server.secure.generated.ts
          grep -q "deploymentState: 'draft'" server.secure.generated.ts
          grep -q "deploymentState: 'not_generated'" server.secure.generated.ts
          grep -q "disabledLegacyPrefixes" server.secure.generated.ts
          grep -q "No fallback cooking advice was fabricated" server.secure.generated.ts
          if sed -n '/Master Admin Air-Gapped AI Code Generator Endpoint/,/\/\/ Health check/p' server.secure.generated.ts | grep -q "Applied Live"; then
            echo "Fake Applied Live language remains in protected route"
            exit 1
          fi
          if sed -n '/Master Admin Air-Gapped AI Code Generator Endpoint/,/\/\/ Health check/p' server.secure.generated.ts | grep -q "userEmail"; then
            echo "Client-supplied userEmail remains in protected owner route"
            exit 1
          fi

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
