name: Constitution and Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constitutional-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Constitution gate
        run: npm run check:constitution

      - name: TypeScript check
        run: npm run lint

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore ownership rules
        run: npm run test:firestore-rules

      - name: Product contract tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f src/App.tsx
          test -f server.ts
          test -f docs/constitution/SMOKESTACK-APP-CONSTITUTION.txt
          test -f docs/constitution/CHARGPT-CAPABILITIES.txt
          if find src -name '*.trusted.*' -print -quit | grep -q .; then
            echo 'Generated trusted copies are forbidden.'
            exit 1
          fi
          if grep -R "MASTER_ADMIN_EMAIL\|auth_token_default\|Applied Live" src server.ts server; then
            echo 'A forbidden authority or success marker remains.'
            exit 1
          fi
          grep -q "requireAuth, requireOwner" server/adminRoles.ts
          grep -q "syncState: 'writing'" src/lib/firestoreData.ts
          grep -q "SMOKESTACK_RUNTIME_CACHE" public/sw.js
