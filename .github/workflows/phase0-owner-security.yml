name: Phase 0 Trust Foundation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and verify trusted runtime
        run: npm run verify:owner-security

      - name: Verify trusted client assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f src/App.trusted.tsx
          test -f src/components/Navbar.trusted.tsx
          test -f src/utils/storage.trusted.ts
          grep -q "userSession?.isMasterAdmin === true" src/components/Navbar.trusted.tsx
          grep -q "'/api/admin/me'" src/App.trusted.tsx
          grep -q "Firestore is authoritative" src/App.trusted.tsx
          grep -q "deletedCookLogIds: tombstones" src/App.trusted.tsx
          grep -q "const cleanProfile: SmokerProfile = { ...INITIAL_SMOKER_PROFILE }" src/App.trusted.tsx
          if grep -q "auth_token_default" src/App.trusted.tsx; then echo "Legacy default auth token remains"; exit 1; fi
          if grep -q "MASTER_ADMIN_EMAIL" src/App.trusted.tsx; then echo "Hard-coded owner email remains"; exit 1; fi
          if grep -q "autoEvolveCharGPTMemory" src/App.trusted.tsx; then echo "Automatic durable AI learning remains"; exit 1; fi
          if grep -q "isMasterAdmin(currentUserEmail)" src/components/Navbar.trusted.tsx; then echo "Navbar still trusts email"; exit 1; fi
          if grep -q "hoursLogged = 6.0" src/utils/storage.trusted.ts; then echo "Fabricated cook duration remains"; exit 1; fi
          if grep -q "Excellent smoke ring" src/utils/storage.trusted.ts; then echo "Fabricated cook notes remain"; exit 1; fi

      - name: Verify trusted data and UX assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "schemaVersion: '0.03'" src/lib/firestoreData.ts
          grep -q "deletedCookLogIds" src/lib/firestoreData.ts
          grep -q "deleteDoc" src/lib/firestoreData.ts
          if grep -q "schemaVersion: '0.04A'" src/lib/firestoreData.ts; then echo "Legacy 0.04A Firestore schema label remains"; exit 1; fi
          if grep -q "lastSyncedAt: userData.lastSyncedAt || new Date" src/lib/firestoreData.ts; then echo "Firestore load fabricates sync timestamp"; exit 1; fi
          grep -q "Not yet published" src/components/AppDownloadStoreModal.tsx
          grep -q "Google Drive is a separate backup/export destination" src/components/SettingsModal.tsx
          if grep -q "MasterVersionSyncCard\|MasterSyncEngine\|MASTER_ADMIN_EMAIL\|isAdminUser" src/components/SettingsModal.tsx; then echo "Legacy admin/master-sync controls remain in Settings"; exit 1; fi

      - name: Verify trusted server assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f server.secure.generated.ts
          grep -q "requireOwner as any" server.secure.generated.ts
          grep -q "deploymentState: 'draft'" server.secure.generated.ts
          grep -q "deploymentState: 'not_generated'" server.secure.generated.ts
          grep -q "disabledLegacyPrefixes" server.secure.generated.ts
          grep -q "'/api/federated-learning'" server.secure.generated.ts
          grep -q "'/api/manufacturer-smokers'" server.secure.generated.ts
          grep -q "'/api/verified-cuts'" server.secure.generated.ts
          grep -q "No fallback cooking advice was fabricated" server.secure.generated.ts
          if sed -n '/Master Admin Air-Gapped AI Code Generator Endpoint/,/\/\/ Health check/p' server.secure.generated.ts | grep -q "Applied Live"; then echo "Fake Applied Live language remains"; exit 1; fi
          if sed -n '/Master Admin Air-Gapped AI Code Generator Endpoint/,/\/\/ Health check/p' server.secure.generated.ts | grep -q "userEmail"; then echo "Client-supplied userEmail remains"; exit 1; fi

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
