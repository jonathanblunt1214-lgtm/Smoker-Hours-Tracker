name: SmokeStack PR Validation

on:
  pull_request:
    branches: [main, SmokeStack-development]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce mandatory branch chain
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: npm run test:agent-governance

      - name: Lint and type-check
        run: npm run lint

      - name: Run CharGPT contract tests when present
        shell: bash
        run: |
          set -euo pipefail
          if npm pkg get scripts.test:chargpt-contract | grep -qv '^{}$'; then
            npm run test:chargpt-contract
          elif test -f scripts/test-chargpt-contract.mts; then
            echo "CharGPT contract test file exists without the required package script" >&2
            exit 1
          else
            echo "No CharGPT contract tests are present."
          fi

      - name: Run database harvester contract tests
        run: npm run test:database-harvesters

      - name: Run Operations dashboard contract tests
        run: npm run test:operations-dashboard

      - name: Build production release
        run: npm run build
