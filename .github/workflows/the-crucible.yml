name: The Crucible

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * 0'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  crucible:
    name: The Crucible
    uses: 6076446993/The-Crucible/.github/workflows/the-crucible.yml@2bf9e86b76f8555465f59560112d0ceba9b47ea2
    with:
      core_ref: 2bf9e86b76f8555465f59560112d0ceba9b47ea2
      config_path: .thecrucible.json
      run_workload: ${{ github.event_name != 'schedule' || github.event.schedule == '47 4 * * 0' }}
      weekly_maintenance: ${{ github.event.schedule == '47 4 * * 0' }}
      dependency_review: true
    secrets:
      security_read_token: ${{ secrets.SECURITY_READ_TOKEN }}
