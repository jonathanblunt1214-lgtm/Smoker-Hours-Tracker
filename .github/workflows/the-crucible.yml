name: The Crucible

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * 0'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  crucible:
    name: The Crucible
    uses: jonathanblunt1214-lgtm/The-Crucible/.github/workflows/the-crucible.yml@e15a8a0871ba1b0c42b1cb36933a894c3b5bbdb7
    with:
      core_ref: e15a8a0871ba1b0c42b1cb36933a894c3b5bbdb7
      config_path: .thecrucible.json
      run_workload: ${{ github.event_name != 'schedule' || github.event.schedule == '47 4 * * 0' }}
      weekly_maintenance: ${{ github.event.schedule == '47 4 * * 0' }}
      dependency_review: true
      malware_scan: false
    secrets:
      security_read_token: ${{ secrets.SECURITY_READ_TOKEN }}
