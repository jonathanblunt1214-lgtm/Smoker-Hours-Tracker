name: Backup Smoke Stack Firestore

on:
  schedule:
    - cron: '17 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: smokestack-firestore-backup
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: smoker-log-app
  BACKUP_BUCKET: smoker-log-app-firestore-backups
  DEPLOYER_SERVICE_ACCOUNT: smokestack-github@smoker-log-app.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/562567954075/locations/global/workloadIdentityPools/github/providers/smokestack

jobs:
  backup:
    name: Export and verify the default Firestore database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - id: auth
        name: Authenticate without a stored Google key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify the dedicated backup bucket
        run: gcloud storage buckets describe "gs://${BACKUP_BUCKET}" --project="${GCP_PROJECT_ID}"

      - name: Export Firestore
        id: export
        shell: bash
        run: |
          set -euo pipefail
          backup_id="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          destination="gs://${BACKUP_BUCKET}/scheduled/${backup_id}"
          gcloud firestore export "${destination}" \
            --database='(default)' \
            --project="${GCP_PROJECT_ID}" \
            --quiet
          echo "destination=${destination}" >> "${GITHUB_OUTPUT}"

      - name: Verify exported backup metadata
        id: verify
        env:
          DESTINATION: ${{ steps.export.outputs.destination }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(gcloud storage ls --recursive "${DESTINATION}/**" | grep -E '\.overall_export_metadata$' | head -n 1)"
          test -n "${manifest}"
          bytes="$(gcloud storage cat "${manifest}" | wc -c | tr -d ' ')"
          test "${bytes}" -gt 0
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"
          echo "bytes=${bytes}" >> "${GITHUB_OUTPUT}"

      - name: Record verified backup result
        env:
          DESTINATION: ${{ steps.export.outputs.destination }}
          MANIFEST: ${{ steps.verify.outputs.manifest }}
          MANIFEST_BYTES: ${{ steps.verify.outputs.bytes }}
        run: |
          echo "## Smoke Stack Firestore backup" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Project: ${GCP_PROJECT_ID}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Database: (default)" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Destination: ${DESTINATION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Read-back manifest: ${MANIFEST}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Manifest bytes read: ${MANIFEST_BYTES}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Retention: no automatic deletion" >> "${GITHUB_STEP_SUMMARY}"
