<html lang="en" class="h-full bg-[#121212]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smoke Stack" />
    <meta name="description" content="Cross-platform pitmaster BBQ smoke logger, fuel calculator, CharGPT AI advisor, and multi-pit fleet manager." />
    <title>Smoke Stack • Pitmaster Cook & Fuel Log</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-[#121212] text-[#e0e0e0] antialiased selection:bg-orange-500 selection:text-zinc-950">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Smoke Stack ServiceWorker registered:', reg.scope))
            .catch(err => console.log('Smoke Stack ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
